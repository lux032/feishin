name: Test

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v6

            - name: Install Node.js and PNPM
              uses: pnpm/action-setup@v5

            - name: Install dependencies
              run: pnpm install

            - name: Lint Files
              run: pnpm run lint

    commitlint:
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Install Node.js and PNPM
              uses: pnpm/action-setup@v4

            - name: Install dependencies
              run: pnpm install

            - name: Lint PR commits
              if: github.event_name == 'pull_request'
              run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

            - name: Lint push commits
              if: github.event_name == 'push'
              run: |
                  if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                    pnpm exec commitlint --last --verbose
                  else
                    for commit in $(git rev-list --first-parent --reverse "${{ github.event.before }}..${{ github.event.after }}"); do
                      git show -s --format=%B "$commit" | pnpm exec commitlint --verbose || exit 1
                    done
                  fi
